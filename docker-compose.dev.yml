name: unsareport-registry-dev

networks:
  unsareport-dev:
    external: true

services:
  traefik:
    image: traefik:v3.3
    container_name: registry-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=unsareport-dev
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --log.level=INFO
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "9876:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [unsareport-dev]

  postgres:
    image: postgres:16-alpine
    container_name: registry-postgres
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registrypassword
      POSTGRES_DB: registry_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [unsareport-dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idppassword
      POSTGRES_DB: idp_db
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks: [unsareport-dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: registry-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks: [unsareport-dev]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: ghcr.io/unsareport/auth:latest-dev
    pull_policy: always
    container_name: registry-auth
    environment:
      DATABASE_URL: postgresql://idp:idppassword@postgres-auth:5432/idp_db
      IDP_ISSUER: http://localhost:9876/api/auth
      IDP_PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      IDP_ALLOWED_ORIGINS: http://localhost:9876
      CLIENT_REDIRECT_URL: http://localhost:9876
      ADMIN_API_KEY: admin-secret-key-12345
      ACCESS_TOKEN_TTL: 900
      REFRESH_TOKEN_TTL: 2592000
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks: [unsareport-dev]
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/api/auth`) || Path(`/.well-known/jwks.json`)
      - traefik.http.routers.auth.entryPoints=web
      - traefik.http.routers.auth.priority=10
      - traefik.http.routers.auth.middlewares=auth-strip
      - traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api/auth
      - traefik.http.middlewares.auth-strip.stripprefix.forceSlash=false
      - traefik.http.services.auth.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:'+(process.env.IDP_PORT||3000)+'/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  pgdata-auth:
  miniodata:
